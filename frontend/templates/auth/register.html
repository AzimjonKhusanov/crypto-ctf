{% extends 'base.html' %}
{% block title %}Ro'yxatdan o'tish{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-box">
    <div style="text-align:center; margin-bottom:1.5rem;">
      <div style="font-size:2rem; font-family:var(--mono);">
        <span style="color:var(--green);">NULL</span><span style="color:var(--cyan);">CTF</span>
      </div>
    </div>
    <h1 class="auth-title">Ro'yxatdan o'tish</h1>
    <p class="auth-sub">Allaqachon hisobingiz bormi? <a href="{{ url_for('auth.login') }}">Kiring</a></p>

    <form method="POST">
      <div class="form-group">
        <label class="form-label">Foydalanuvchi nomi</label>
        <input type="text" name="username" class="form-control" required autofocus
               placeholder="username" minlength="3" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required
               placeholder="user@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Parol</label>
        <input type="password" name="password" class="form-control" required
               placeholder="kamida 8 belgi" minlength="8" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label">Parolni tasdiqlang</label>
        <input type="password" name="confirm_password" class="form-control" required
               placeholder="parolni takrorlang" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-full">Ro'yxatdan o'tish</button>
    </form>
  </div>
</div>
{% endblock %}
