version: '3.9'

services:
  nullctf:
    build: .
    container_name: nullctf_app
    ports:
      - "5000:5000"
    environment:
      # ⚠️  MUHIM: Quyidagi qiymatlarni .env faylda o'zgartiring!
      - SECRET_KEY=${SECRET_KEY:-super-secret-change-this-now}
      - DATABASE_URL=sqlite:////app/data/nullctf.db
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      # Admin paroli bcrypt hash ko'rinishida:
      # python -c "from werkzeug.security import generate_password_hash; print(generate_password_hash('YourPassword'))"
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - FLASK_ENV=production
    volumes:
      # Ma'lumotlar bazasini saqlash uchun
      - nullctf_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  nullctf_data:
    driver: local
